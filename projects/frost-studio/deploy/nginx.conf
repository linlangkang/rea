server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json model/gltf+json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /health { default_type text/plain; return 200 'ok'; }
  # A content hash changes the URL when a render asset changes. WebP is already compressed.
  location ~ ^/(assets/|(?:materials|environment|models)/optimized/) {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }
  location ~ ^/models/.*\.gltf$ { default_type model/gltf+json; expires 7d; try_files $uri =404; }
  location ~ ^/(environment|materials|models)/ { expires 7d; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header X-Frame-Options SAMEORIGIN always; }
  location / { try_files $uri $uri/ /index.html; }
}
